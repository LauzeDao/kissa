# kissa – Installer-ISO bauen (nur manuell: Actions → "iso kissa" → Run workflow)
#
# Ergebnis: ISO als Artefakt zum Herunterladen (wird nach 3 Tagen gelöscht).
# Installiert kissa direkt – ohne den Umweg über Aurora + "bootc switch".
name: iso kissa

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kissa
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  iso:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Speicherplatz freimachen (Image + ISO brauchen viel Platz)
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # main (wie image-template)
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Image-Namen festlegen
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:latest" >> "$GITHUB_ENV"
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: cosign installieren
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5

      - name: Signatur des Images prüfen (nur signierte Images kommen ins ISO)
        run: cosign verify --key cosign.pub "$IMAGE" > /dev/null && echo "Signatur gültig"

      - name: ISO bauen
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main (wie image-template)
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: ISO hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kissa-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Zusammenfassung
        run: |
          {
            echo "### 💿 kissa-ISO gebaut"
            echo ""
            echo "- Quelle: \`${IMAGE}\` (Signatur geprüft)"
            echo "- SHA-256: \`${{ steps.build.outputs.anaconda-iso-output-checksum }}\`"
            echo "- Download: Artefakt **kissa-iso** unten auf dieser Seite (3 Tage verfügbar)"
            echo ""
            echo "Auf USB-Stick schreiben (Fedora Media Writer/Rufus), booten, installieren, LUKS an, Benutzer als Administrator."
          } >> "$GITHUB_STEP_SUMMARY"
