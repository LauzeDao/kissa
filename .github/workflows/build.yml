# kissa – Image bauen, nach GHCR pushen und signieren
#
# - push auf main / manuell: bauen, pushen, signieren
# - täglich: neu bauen, damit Aurora- und Fedora-Updates ankommen
# - Pull Request: nur bauen (Test), nichts pushen
name: build kissa

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * *" # täglich 04:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kissa
  # podman und cosign teilen sich dieselbe Login-Datei
  REGISTRY_AUTH_FILE: /home/runner/.docker/config.json

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Push nach ghcr.io
    steps:
      - name: Speicherplatz freimachen (das Image ist groß)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Konfiguration prüfen (bash, TOML, JSON)
        run: bash tools/check.sh

      - name: Image-Namen und Tags festlegen
        run: |
          # GHCR verlangt Kleinbuchstaben (LauzeDao -> lauzedao)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "DATE_TAG=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Image bauen
        run: |
          podman build \
            --pull=newer \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${DATE_TAG}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${DATE_TAG}" \
            .

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$(dirname "$REGISTRY_AUTH_FILE")"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Image pushen
        if: github.event_name != 'pull_request'
        run: |
          podman push --digestfile digest.txt "${IMAGE}:latest"
          podman push "${IMAGE}:${DATE_TAG}"
          echo "DIGEST=$(cat digest.txt)" >> "$GITHUB_ENV"

      - name: cosign installieren
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # v2 signiert im klassischen Format, das podman/bootc auf dem Laptop prüfen kann
          cosign-release: v2.6.5

      - name: Image signieren
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Signatur prüfen (wie später der Laptop)
        if: github.event_name != 'pull_request'
        run: cosign verify --key cosign.pub "${IMAGE}@${DIGEST}" > /dev/null && echo "Signatur gültig"

      - name: Zusammenfassung
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### 🐾 kissa gebaut"
            echo ""
            echo "- Image: \`${IMAGE}:latest\` und \`${IMAGE}:${DATE_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo ""
            echo "Umsteigen: \`sudo bootc switch ${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
