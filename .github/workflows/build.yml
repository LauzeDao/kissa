# kissa – Image bauen, nach GHCR pushen und signieren
#
# - push auf main / manuell: bauen, pushen, signieren
# - täglich: neu bauen, damit Aurora- und Fedora-Updates ankommen
# - Pull Request: nur bauen (Test), nichts pushen
name: build kissa

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * *" # täglich 04:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kissa
  # podman und cosign teilen sich dieselbe Login-Datei
  REGISTRY_AUTH_FILE: /home/runner/.docker/config.json

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Push nach ghcr.io
      security-events: write # Scan-Ergebnisse in "Code scanning"
      actions: read # Paketliste des letzten Builds laden (Änderungsprotokoll)
    steps:
      - name: Speicherplatz freimachen (das Image ist groß)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Konfiguration prüfen (bash, TOML, JSON)
        run: bash tools/check.sh

      - name: Image-Namen und Tags festlegen
        run: |
          # GHCR verlangt Kleinbuchstaben (LauzeDao -> lauzedao)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "DATE_TAG=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Image bauen
        run: |
          podman build \
            --pull=newer \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${DATE_TAG}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${DATE_TAG}" \
            .

      - name: Image testen (ist alles drin?)
        run: podman run --rm --network=none -v "$PWD/tests:/tests:ro" "${IMAGE}:latest" bash /tests/image-test.sh

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$(dirname "$REGISTRY_AUTH_FILE")"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Image pushen
        if: github.event_name != 'pull_request'
        run: |
          podman push --digestfile digest.txt "${IMAGE}:latest"
          podman push "${IMAGE}:${DATE_TAG}"
          echo "DIGEST=$(cat digest.txt)" >> "$GITHUB_ENV"

      - name: cosign installieren
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # v2 signiert im klassischen Format, das podman/bootc auf dem Laptop prüfen kann
          cosign-release: v2.6.5

      - name: Image signieren
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Signatur prüfen (wie später der Laptop)
        if: github.event_name != 'pull_request'
        run: cosign verify --key cosign.pub "${IMAGE}@${DIGEST}" > /dev/null && echo "Signatur gültig"

      - name: Zusammenfassung
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### 🐾 kissa gebaut"
            echo ""
            echo "- Image: \`${IMAGE}:latest\` und \`${IMAGE}:${DATE_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo ""
            echo "Umsteigen: \`sudo bootc switch ${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- Stückliste (SBOM), Schwachstellen, Änderungsprotokoll ----------
      # Diese Schritte berichten nur; ein Fund oder ein Ausfall stoppt das Update nicht.
      - name: syft installieren
        id: syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          syft-version: v1.57.2

      - name: trivy installieren
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: SBOM erstellen und nach Schwachstellen scannen
        id: scan
        continue-on-error: true
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          export TRIVY="$(command -v trivy)"
          # Dateisystem des Images direkt einhängen (rootless: im User-Namespace von podman)
          podman unshare bash -euo pipefail -c '
            mnt=$(podman image mount "${IMAGE}:latest")
            trap "podman image umount \"${IMAGE}:latest\" >/dev/null" EXIT
            "$SYFT" scan "dir:$mnt" --quiet --output spdx-json=sbom.spdx.json
            "$TRIVY" rootfs "$mnt" --quiet --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
              --format json --output trivy.json
          '
          trivy convert --format sarif --output trivy.sarif trivy.json
          {
            echo "### 🔎 Schwachstellen (HIGH/CRITICAL, nur mit verfügbarem Fix)"
            echo ""
            jq -r '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + .PkgName)
                   | "- CRITICAL: \(map(select(.Severity=="CRITICAL"))|length)\n- HIGH: \(map(select(.Severity=="HIGH"))|length)"' trivy.json
            echo ""
            echo "Details: Security → Code scanning (bei Pushes auf main) und Artefakt **sbom**."
            echo "SBOM: $(jq '.packages | length' sbom.spdx.json) Pakete erfasst (SPDX-JSON)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM signiert an das Image hängen
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        continue-on-error: true
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Scan-Ergebnisse nach GitHub (Code scanning)
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-kissa-image

      - name: SBOM und Scan als Artefakt
        if: steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.spdx.json
            trivy.json
          retention-days: 90

      - name: Änderungsprotokoll (Pakete gegenüber dem letzten Build)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          podman run --rm --network=none "${IMAGE}:latest" \
            rpm -qa --queryformat '%{NAME}.%{ARCH} %{VERSION}-%{RELEASE}\n' | sort > packages.txt
          echo "### 📦 Pakete ($(wc -l < packages.txt) installiert)" >> "$GITHUB_STEP_SUMMARY"
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
                   --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z $prev ]] || ! gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name packages --dir prev 2>/dev/null; then
            echo "Kein Vorgänger-Build mit Paketliste gefunden – ab dem nächsten Build gibt es hier den Vergleich." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk 'NR==FNR {old[$1]=$2; next}
               { if (!($1 in old)) add[$1]=$2; else if (old[$1]!=$2) upd[$1]=old[$1] " → " $2; delete old[$1] }
               END {
                 n=0; for (p in upd) n++; printf "\n**Aktualisiert (%d)**\n\n", n; for (p in upd) printf "- `%s` %s\n", p, upd[p]
                 n=0; for (p in add) n++; printf "\n**Neu (%d)**\n\n", n; for (p in add) printf "- `%s` %s\n", p, add[p]
                 n=0; for (p in old) n++; printf "\n**Entfernt (%d)**\n\n", n; for (p in old) printf "- `%s` %s\n", p, old[p]
               }' prev/packages.txt packages.txt > changes.md
          echo "Vergleich mit Lauf [$prev](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$prev):" >> "$GITHUB_STEP_SUMMARY"
          cat changes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Paketliste als Artefakt (Basis für den nächsten Vergleich)
        if: hashFiles('packages.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages.txt
          retention-days: 90
